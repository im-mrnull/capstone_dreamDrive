<!-- DreamDrive trajectory scene viewer. Filled in by scripts/viz_render.py: Plotly.js and the scene
     bundles (scripts/viz_scene_bundle.py) are inlined, so the file works offline. Everything drawn
     comes from the bundle; the viewer computes nothing but geometry for display. -->
<title>DreamDrive scene viewer</title>
<meta charset="utf-8">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2733; --muted: #5f6b7a; --line: #dfe3e8; --accent: #e3171b;
  --chip: #eef1f5; --warn: #b45309; --ok: #12813f;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b0f14; --panel: #121821; --ink: #e6ebf1; --muted: #93a0b0; --line: #243040; --accent: #ff4d4d;
  --chip: #1b2430; --warn: #f0a04b; --ok: #3ddc84;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .scene { color: var(--muted); }
.tabs { display: flex; gap: 2px; background: var(--chip); padding: 2px; border-radius: 8px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.tabs button:disabled { opacity: .45; cursor: not-allowed; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.btn:hover { border-color: var(--muted); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--chip); color: var(--muted); }
.badge.offline { background: #fff1d6; color: #8a5300; }
:root[data-theme="dark"] .badge.offline { background: #3a2a10; color: #f0b45a; }
main { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
#plot { min-height: 0; background: var(--panel); }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px 14px 20px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 16px 0 6px; font-weight: 650; }
aside h2:first-child { margin-top: 4px; }
select { width: 100%; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
.model-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
.model-meta .caveat { color: var(--warn); }
.layers label { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
.layers .sw { width: 18px; height: 3px; border-radius: 2px; flex: none; }
.row { display: flex; gap: 6px; align-items: center; }
.seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 3px 8px; cursor: pointer; font: inherit; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--panel); }
#card { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
#card .k { color: var(--muted); }
#card table { width: 100%; border-collapse: collapse; }
#card td { padding: 1px 0; vertical-align: top; }
#card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
#agents { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
#agents div { display: grid; grid-template-columns: 12px 38px 1fr auto; gap: 6px; padding: 3px 8px; cursor: pointer; align-items: center; border-bottom: 1px solid var(--line); }
#agents div:last-child { border-bottom: 0; }
#agents div:hover { background: var(--chip); }
#agents div.sel { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
#agents .dot { width: 10px; height: 10px; border-radius: 50%; }
#agents .flags { font-size: 11px; color: var(--muted); }
.note { color: var(--muted); font-size: 12px; }
details summary { cursor: pointer; color: var(--muted); }
details ul { padding-left: 18px; margin: 6px 0; color: var(--muted); font-size: 12px; }
footer { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#timeline { position: relative; flex: 1; min-width: 260px; height: 30px; }
#timeline input { width: 100%; position: absolute; top: 4px; margin: 0; accent-color: var(--accent); }
#ticks { position: absolute; left: 0; right: 0; top: 22px; height: 8px; pointer-events: none; }
#ticks span { position: absolute; width: 2px; height: 7px; background: var(--accent); opacity: .75; transform: translateX(-1px); }
#clock { font-variant-numeric: tabular-nums; min-width: 230px; color: var(--muted); }
#clock b { color: var(--ink); }
</style>

<div id="app">
  <header>
    <h1>DreamDrive scene viewer</h1>
    <span class="scene" id="sceneTitle"></span>
    <div class="tabs" id="modes"></div>
    <span class="spacer"></span>
    <span class="badge offline" id="offlineBadge" title="Ground-truth futures, oracle best-of-K, conflicts and coverage use the future: offline evaluation only">OFFLINE EVALUATION</span>
    <span class="badge" title="Development results: not for publication before the IP review">dev only</span>
    <button class="btn" id="themeBtn" title="Light / dark presentation theme">Theme</button>
    <button class="btn" id="pngBtn" title="Export the current figure as PNG at 4x resolution">PNG ×4</button>
    <button class="btn" id="svgBtn" title="Export the current figure as vector SVG">SVG</button>
  </header>
  <main>
    <div id="plot"></div>
    <aside>
      <div id="sceneBox" hidden><h2>Scene</h2><select id="scenePick"></select></div>
      <h2>Model</h2>
      <select id="model"></select>
      <div class="model-meta" id="modelMeta"></div>
      <div id="compareBox" hidden>
        <h2>Compare (mode D)</h2>

        <select id="cmp3"></select><div style="height:4px"></div><select id="cmp4"></select>
      </div>
      <h2>Horizon</h2>
      <div class="seg" id="horizon"></div>
      <h2>Alternative futures shown</h2>
      <div class="seg" id="topk"></div>
      <h2>Layers</h2>
      <div class="layers" id="layers"></div>
      <h2>Selected agent</h2>
      <div id="card"></div>
      <h2>Agents at this time</h2>
      <div id="agents"></div>
      <h2>About this figure</h2>
      <details><summary>Data, frames and definitions</summary><ul id="about"></ul></details>
    </aside>
  </main>
  <footer>
    <button class="btn" id="resetBtn" title="Reset to the first frame">⏮</button>
    <button class="btn" id="prevBtn" title="Previous prediction issue time">◀ issue</button>
    <button class="btn" id="playBtn" style="min-width:70px">▶ Play</button>
    <button class="btn" id="nextBtn" title="Next prediction issue time">issue ▶</button>
    <div class="seg" id="speeds"></div>
    <div id="timeline"><input type="range" id="slider" min="0" max="99" step="0.1" value="0"><div id="ticks"></div></div>
    <div id="clock"></div>
  </footer>
</div>

        if (P.danger_ml) rows.push(["Danger score D (band)", P.danger_ml[k] == null ? "—" : `${P.danger_ml[k].toFixed(2)}${P.danger_ml[k] <= 1 ? " · flagged" : ""}`]);
      }
      if (off && W.conflict) rows.push(["Conflict with ego (≤ 5 m)", W.conflict[k] ? "<b style='color:var(--accent)'>yes</b>" : "no"], ["Min. separation to ego", W.kin.min_sep_gt_m[k] == null ? "—" : `${W.kin.min_sep_gt_m[k].toFixed(1)} m at +${((W.kin.min_sep_gt_step[k] + 1) / 10).toFixed(1)} s`]);
      if (W.kin) rows.push(["TTC, constant velocity, 5 m", W.kin.ttc_cv_s[k] == null ? "none within 6 s" : W.kin.ttc_cv_s[k].toFixed(1) + " s"]);
    }
    card.innerHTML = `<table>${rows.map(([a, b]) => `<tr><td class="k">${a}</td><td>${b}</td></tr>`).join("")}</table>`;
  }
  // agent list (present now)
  const list = document.getElementById("agents"), items = [];
  for (let a = 0; a < S.A; a++) { const p = posAt(S, a, t); if (!p) continue; const k = W ? W.slot[a] : null, v = speedAt(S, a, t);
    const P = W && k != null && st.model ? pred(S, W, st.model) : null, G = GROUPS[S.B.agents.group[a]] || GROUPS.other;
    const flags = [k != null ? "pred" : "", off && k != null && W.conflict && W.conflict[k] ? "conflict" : "", P && P.danger_ml && P.danger_ml[k] != null && P.danger_ml[k] <= 1 ? "danger" : ""].filter(Boolean).join(" · ");
    items.push(`<div data-a="${a}" class="${a === st.sel ? "sel" : ""}"><span class="dot" style="background:${G.c};border:1px solid ${G.d}"></span><span>${S.B.agents.ids[a]}</span><span>${S.B.agents.cls[a]} ${v == null ? "" : `<span class="flags">${v.toFixed(1)} m/s</span>`}</span><span class="flags">${flags}</span></div>`); }
  list.innerHTML = items.join("");
}
function modelOptions(selEl, value) {
  selEl.innerHTML = "";

  S.models.forEach(m => (groups[m.domain] ||= []).push(m));
  for (const [d, ms] of Object.entries(groups)) {
    const inDom = d.includes("in-domain on AV2");
    const og = document.createElement("optgroup"); og.label = d === "none (no training)" ? "Baseline" : d.startsWith("IDD") ? "Trained on IDD-3D (in-domain)" : inDom ? "Trained on Argoverse 2 (in-domain here)" : "Trained on Argoverse 2 (zero-shot on IDD-3D)";
    const tag = d === "none (no training)" ? "baseline" : d.startsWith("IDD") ? "IDD" : inDom ? "AV2" : "AV2→IDD";
    ms.forEach(m => { const o = document.createElement("option"); o.value = m.key; o.textContent = `${m.label} [${tag}]` + (m.available ? (m.kind !== "point" ? ` · ${m.kind} K=${m.K}` : "") : " · unavailable"); o.disabled = !m.available; o.title = m.available ? m.source : m.reason; og.appendChild(o); });
    selEl.appendChild(og);

}
function buildControls() {
  const tabs = document.getElementById("modes"); tabs.innerHTML = "";
  for (const [k, v] of Object.entries(MODES)) { const b = document.createElement("button"); b.textContent = v; b.className = st.mode === k ? "on" : ""; b.disabled = (k === "F" && !scenes.some(s => s.B.scene.dataset === "Argoverse 2")) || (k === "E" && !!S.B.public);
    b.title = !b.disabled ? "" : k === "E" ? "Not in public files: they carry no calibrated bands" : "Needs an Argoverse 2 scene bundle (next step)"; b.onclick = () => setMode(k); tabs.appendChild(b); }
  const sp0 = document.getElementById("scenePick"); document.getElementById("sceneBox").hidden = scenes.length < 2;
  sp0.innerHTML = scenes.map((s, i) => `<option value="${i}">${s.B.scene.dataset} ${s.B.scene.split} · ${s.B.scene.id.slice(0, 26)}</option>`).join(""); sp0.value = st.scene;
  sp0.onchange = () => { switchScene(+sp0.value); buildControls(); render(); };
  modelOptions(document.getElementById("model"), st.model);
  const m = S.byKey[st.model];
  document.getElementById("modelMeta").innerHTML = m ? `${m.domain}<br>${m.status}<br>Most-likely: ${m.ml_definition}` + (m.set_definition ? `<br>Alternatives: ${m.set_definition} (K = ${m.K})` : "<br>One path only: no alternatives, no distribution") +
    (m.caveat ? `<br><span class="caveat">⚠ ${m.caveat}</span>` : "") : "";
  document.getElementById("compareBox").hidden = st.mode !== "D";
  ["cmp1", "cmp2", "cmp3", "cmp4"].forEach((id, i) => { const e = document.getElementById(id); modelOptions(e, st.cmp[i]); e.onchange = () => { st.cmp[i] = e.value; render(); }; });
  const hz = document.getElementById("horizon"); hz.innerHTML = "";
  for (let h = 1; h <= 6; h++) { const b = document.createElement("button"); b.textContent = h + " s"; b.className = st.h === h ? "on" : ""; b.onclick = () => { st.h = h; buildControls(); render(); }; hz.appendChild(b); }
  const tk = document.getElementById("topk"); tk.innerHTML = "";
  for (const k of [1, 3, 6, 10, 20]) { const b = document.createElement("button"); b.textContent = k === 1 ? "none" : k; b.className = st.topk === k ? "on" : ""; b.onclick = () => { st.topk = k; buildControls(); render(); }; tk.appendChild(b); }
  const ly = document.getElementById("layers"), C = THEMES[st.theme]; ly.innerHTML = "";
  for (const [k, name, col] of LAYERS) {
    if (S.B.public && PRIVATE_LAYERS.includes(k)) continue;
    const l = document.createElement("label"), c = document.createElement("input"); c.type = "checkbox"; c.checked = !!st.on[k];
    c.onchange = () => { st.on[k] = c.checked ? 1 : 0; render(); };
    const sw = document.createElement("span"); sw.className = "sw"; const cc = C[col]; sw.style.background = Array.isArray(cc) ? cc[0] : (col === "density" ? `rgb(${cc})` : cc);
    l.append(c, sw, name); ly.appendChild(l);
  }
  const sp = document.getElementById("speeds"); sp.innerHTML = "";
  for (const s of [0.25, 0.5, 1, 2, 4]) { const b = document.createElement("button"); b.textContent = s + "×"; b.className = st.speed === s ? "on" : ""; b.onclick = () => { st.speed = s; buildControls(); }; sp.appendChild(b); }
  const ticks = document.getElementById("ticks"); ticks.innerHTML = "";
  S.windows.forEach(w => { const s = document.createElement("span"); s.style.left = (100 * w.raw.issue_frame / (S.T - 1)) + "%"; s.title = `prediction issued at ${(w.raw.issue_frame / S.fps).toFixed(1)} s`; ticks.appendChild(s); });
  document.getElementById("sceneTitle").textContent = `${S.B.scene.id} · ${S.A} agents · ${(S.T / S.fps).toFixed(0)} s at ${S.fps} Hz`;
  document.getElementById("about").innerHTML = [...S.B.scene.notes, `Frame: ${S.B.scene.frame}.`, ...(S.B.calibration ? [`Conformal bands calibrated on ${S.B.calibration.label} (${S.B.calibration.rows} agent-windows; never this scene).`] : []),
    ...Object.entries(S.B.definitions).map(([k, v]) => `<b>${k}</b>: ${v}`), `Ego: ${S.B.ego.source}.`].map(x => `<li>${x}</li>`).join("");
  document.documentElement.dataset.theme = st.theme;
}

// ---------------------------------------------------------------- events and playback
let last = 0, lastDraw = 0;
function tick(ts) {
  if (st.playing) {
    const dt = last ? (ts - last) / 1000 : 0; st.t = Math.min(S.T - 1, st.t + dt * S.fps * st.speed);
    if (st.t >= S.T - 1) { st.playing = false; document.getElementById("playBtn").textContent = "▶ Play"; }
    if (ts - lastDraw > 45) { render(); lastDraw = ts; }
  }
  last = ts; requestAnimationFrame(tick);
}
function wire() {
  document.getElementById("model").onchange = e => { st.model = e.target.value; buildControls(); render(); };
  document.getElementById("playBtn").onclick = () => { if (st.t >= S.T - 1) st.t = 0; st.playing = !st.playing; document.getElementById("playBtn").textContent = st.playing ? "⏸ Pause" : "▶ Play"; };
  document.getElementById("resetBtn").onclick = () => { st.playing = false; st.t = 0; document.getElementById("playBtn").textContent = "▶ Play"; render(); };
  const issues = () => S.windows.map(w => w.raw.issue_frame);
  document.getElementById("prevBtn").onclick = () => { const p = issues().filter(f => f < st.t - 1e-6).pop(); if (p != null) { st.t = p; render(); } };
  document.getElementById("nextBtn").onclick = () => { const n = issues().find(f => f > st.t + 1e-6); if (n != null) { st.t = n; render(); } };
  document.getElementById("slider").oninput = e => { st.t = parseFloat(e.target.value); render(); };
  document.getElementById("themeBtn").onclick = () => { st.theme = st.theme === "light" ? "dark" : "light"; buildControls(); render(); };
  const exp = fmtx => Plotly.downloadImage("plot", { format: fmtx, scale: fmtx === "png" ? 4 : 1, width: document.getElementById("plot").clientWidth, height: document.getElementById("plot").clientHeight,
                                                  filename: `dreamdrive_${S.B.scene.id}_${st.mode}_t${(st.t / S.fps).toFixed(1)}s_${st.model}` });
  document.getElementById("pngBtn").onclick = () => exp("png");
  document.getElementById("svgBtn").onclick = () => exp("svg");
  document.getElementById("agents").onclick = e => { const d = e.target.closest("[data-a]"); if (d) { st.sel = +d.dataset.a; render(); } };
  document.getElementById("plot").on("plotly_click", ev => { const p = ev.points.find(q => q.data.name === "agents"); if (p) { st.sel = p.customdata; render(); } });
  window.addEventListener("keydown", e => { if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return; if (e.code === "Space") { e.preventDefault(); document.getElementById("playBtn").click(); } if (e.code === "ArrowRight") document.getElementById("nextBtn").click(); if (e.code === "ArrowLeft") document.getElementById("prevBtn").click(); });
}
// In-browser check of the rendering layer: after decoding, anchoring and the display transform, every
// model's ADE for every agent of every window must equal the bundle's (computed in Python from the raw
// files); the transform must be rigid; and each window's history must end where the recorded track is
// at its issue frame (time and identity alignment). Results: window.__selftest and #selftest.
function selfTest() {
  const out = { checked: 0, worst_ade_m: 0, worst_track_m: 0, rigid_m: 0, failures: [] };
  for (let i = 0; i < S.windows.length; i++) {
    const W = win(S, i);
    for (let k = 0; k < W.n; k++) {
      const a = W.agents[k], p = posAt(S, a, W.issue), d = Math.hypot(p[0] - W.last[2 * k], p[1] - W.last[2 * k + 1]);
      out.worst_track_m = Math.max(out.worst_track_m, d);
    }
    for (const m of S.models.filter(m => m.available)) {
      const P = pred(S, W, m.key);
      for (let k = 0; k < W.n; k++) {
        if (P.ade[k] == null) continue;
        let s = 0, n = 0;
        for (let t = 0; t < PRED; t++) if (W.fm[k * PRED + t]) { s += Math.hypot(P.ml[(k * PRED + t) * 2] - W.gt[(k * PRED + t) * 2], P.ml[(k * PRED + t) * 2 + 1] - W.gt[(k * PRED + t) * 2 + 1]); n++; }
        // prediction and truth are each stored to 0.5 cm per axis: a step's error moves by <= sqrt(2) * 1 cm
        const e = Math.abs(s / n - P.ade[k]); out.worst_ade_m = Math.max(out.worst_ade_m, e); out.checked++;
        if (e > 0.0142) out.failures.push(`${m.key} window ${W.t0} agent ${S.B.agents.ids[W.agents[k]]}: ${(s / n).toFixed(3)} vs ${P.ade[k]}`);
      }
    }
  }
  const raw = decXY(S.B.agents.track, S.B.scene.origin), A = S.A;   // rigidity: pairwise distances in both frames
  for (let f = 0; f < S.T; f += 7) for (let a = 0; a + 1 < A; a += 3) {
    const i = (f * A + a) * 2, j = (f * A + a + 1) * 2;
    if (!isFinite(raw[i]) || !isFinite(raw[j])) continue;
    out.rigid_m = Math.max(out.rigid_m, Math.abs(Math.hypot(raw[i] - raw[j], raw[i + 1] - raw[j + 1]) - Math.hypot(S.track[i] - S.track[j], S.track[i + 1] - S.track[j + 1])));
  }
  if (out.worst_track_m > 0.011) out.failures.push(`history end vs recorded track: ${out.worst_track_m.toFixed(3)} m`);
  if (out.rigid_m > 1e-6) out.failures.push(`display transform not rigid: ${out.rigid_m}`);
  out.pass = out.failures.length === 0;

}
function fastest(Sc, W) { let best = null, bv = -1; W.agents.forEach(a => { const v = speedAt(Sc, a, W.issue) || 0; if (v > bv) { bv = v; best = a; } }); return best; }
function switchScene(i) {
  st.scene = i; S = scenes[i];
  const avail = S.models.filter(m => m.available).map(m => m.key);
  if (!avail.includes(st.model)) st.model = avail.includes("led_idd") ? "led_idd" : avail.includes("led_av2") ? "led_av2" : avail[0];
  st.cmp = st.cmp.map(k => avail.includes(k) ? k : st.model);
  const W = win(S, Math.min(3, S.windows.length - 1)); st.t = W.issue; st.sel = fastest(S, W);
}
function init() {
  const avail = S.models.filter(m => m.available).map(m => m.key);
  st.model = avail.includes("led_idd") ? "led_idd" : avail[0];
  st.cmp = ["cv", "mlp_idd", "led_idd", "led_av2"].map(k => avail.includes(k) ? k : avail[0]);
  st.t = S.windows[3] ? S.windows[3].raw.issue_frame : 0;
  const W = win(S, Math.min(3, S.windows.length - 1));        // default selection: the fastest agent with a prediction
  let best = null, bv = -1; W.agents.forEach(a => { const v = speedAt(S, a, W.issue) || 0; if (v > bv) { bv = v; best = a; } }); st.sel = best;
  if (S.B.public) PRIVATE_LAYERS.forEach(k => { st.on[k] = 0; });
  parseHash();
  if (S.B.public) PRIVATE_LAYERS.forEach(k => { st.on[k] = 0; });
  if (new URLSearchParams(location.hash.slice(1)).get("figure") === "1") {   // figure only: no controls (exports, README)
    document.querySelector("header").hidden = true; document.querySelector("aside").hidden = true; document.querySelector("footer").hidden = true;
    document.querySelector("main").style.gridTemplateColumns = "1fr"; document.getElementById("app").style.gridTemplateRows = "1fr";
  }
  document.getElementById("plot").style.height = "100%";
  buildControls(); render(); wire(); requestAnimationFrame(tick);
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get("selftest") === "1") selfTest();
  if (q.get("autoplay") === "1") { st.t = 0; st.speed = parseFloat(q.get("speed") || "1"); st.playing = true; }
  window.__ready = true;
}
try { init(); } catch (err) { document.body.insertAdjacentHTML("afterbegin", `<pre id="fatal" style="color:#b00;padding:12px">Viewer error: ${err.stack || err}</pre>`); window.__error = String(err.stack || err); }
window.addEventListener("error", e => { window.__error = String(e.message); });
</script>
